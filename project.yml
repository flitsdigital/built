name: Built
options:
  bundleIdPrefix: com.jordiklavers
  developmentLanguage: nl
# Projectbreed, niet handmatig in Xcode: Built.xcodeproj staat in .gitignore en wordt
# gegenereerd, dus een instelling die je daar klikt is weg na de volgende `xcodegen`.
settings:
  base:
    DEVELOPMENT_TEAM: WZP3V95T9A
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Built:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Built
      # Mapreferentie: de bestanden gaan als map mee de bundle in, dus zoekt de app ze op
      # met subdirectory "ExerciseMedia". Niet in git — zie .gitignore.
      - path: ExerciseMedia
        type: folder
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
      - target: BuiltWidget
        embed: true
    entitlements:
      path: Built/Built.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jordiklavers.Built]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Built/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Built
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Voor het scannen van barcodes op producten.
        NSHealthShareUsageDescription: Om je dagelijkse stappen te tonen en te vergelijken met je training, slaap en energie.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [built]
    settings:
      TARGETED_DEVICE_FAMILY: 1
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BuiltWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - BuiltWidget
      - Built/DesignSystem.swift   # zelfde kleuren/maten als de app
      - Built/WidgetSnapshot.swift
      - Built/WorkoutActivity.swift
      - Built/RestControlIntent.swift
    entitlements:
      path: BuiltWidget/BuiltWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jordiklavers.Built]
    info:
      path: BuiltWidget/Info.plist
      properties:
        CFBundleDisplayName: Built Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jordiklavers.Built.widget
      TARGETED_DEVICE_FAMILY: 1
  BuiltTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - BuiltTests
    dependencies:
      - target: Built
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TARGETED_DEVICE_FAMILY: 1
      # De app is de host: alleen zo kan `@testable import Built` bij de rekenlogica.
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/Built.app/Built
      TEST_TARGET_NAME: Built
# Zonder dit blok genereert xcodegen geen schemes, en `xcodebuild -scheme Built` faalt op
# een verse checkout. Ze staan hier dus expliciet, inclusief de testactie.
schemes:
  Built:
    build:
      targets:
        Built: all
        BuiltTests: [test]
    test:
      targets:
        - BuiltTests
      # dayKey en Calendar.current lezen de tijdzone van het proces. Vastzetten, anders
      # slagen de DST-tests alleen op een machine die zelf op Amsterdam staat.
      environmentVariables:
        TZ: Europe/Amsterdam
  BuiltWidget:
    build:
      targets:
        BuiltWidget: all
