name: Built
options:
  bundleIdPrefix: com.jordiklavers
  developmentLanguage: nl
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Built:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Built
    dependencies:
      - package: Supabase
        product: Supabase
      - target: BuiltWidget
        embed: true
    entitlements:
      path: Built/Built.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jordiklavers.Built]
    info:
      path: Built/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Built
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Voor het scannen van barcodes op producten.
        NSCalendarsFullAccessUsageDescription: Om je weekplanning in je agenda te zetten en te synchroniseren.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [built]
    settings:
      TARGETED_DEVICE_FAMILY: 1
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BuiltWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - BuiltWidget
      - Built/WidgetSnapshot.swift
      - Built/WorkoutActivity.swift
      - Built/RestControlIntent.swift
    entitlements:
      path: BuiltWidget/BuiltWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jordiklavers.Built]
    info:
      path: BuiltWidget/Info.plist
      properties:
        CFBundleDisplayName: Built Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jordiklavers.Built.widget
      TARGETED_DEVICE_FAMILY: 1
